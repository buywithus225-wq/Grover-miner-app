<!DOCTYPE html>

<head>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #050a18; color: #fff; display: flex; align-items: center; justify-content: center; padding: 8px; }

  .splash { position: fixed; inset: 0; z-index: 9999;

  .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-logo-wrap { position: relative; animation: splashEnter 1s ease-out; }
  @keyframes splashEnter { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .splash-logo-wrap::before { content: ''; position: absolute; inset: -50px;

    border-radius: 50%; animation: splashGlow 2s ease-in-out infinite; }
  @keyframes splashGlow { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } }
  .splash-logo { width: 200px; height: 200px; object-fit: contain; position: relative; z-index: 2;
    filter: drop-shadow(0 0 50px rgba(245,184,0,1)); animation: splashFloat 3s ease-in-out infinite; }
  @keyframes splashFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .splash-title { font-size: 40px; font-weight: 900; letter-spacing: 8px; margin-top: 24px;

  .splash-subtitle { font-size: 12px; color: #6ba3ff; letter-spacing: 10px; text-transform: uppercase;
    font-weight: 700; margin-top: 6px; text-shadow: 0 0 20px rgba(107,163,255,0.8); }
  .loading-bar { position: absolute; bottom: 80px; width: 200px; height: 4px;

  @keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }

  .frame { width: 100%; max-width: 400px; height: 100%; max-height: 820px;

  .frame.show { opacity: 1; }

    background: linear-gradient(90deg, transparent, #f5b800, #ff6b00, #f5b800, transparent);
    background-size: 200% 100%; box-shadow: 0 0 25px #f5b800;
    animation: shimmer 3s linear infinite; z-index: 100; }
  .frame::after { content: ''; position: absolute; bottom: 0; left: 10%; right: 10%; height: 3px;
    background: linear-gradient(90deg, transparent, #0066ff, #8b5cf6, #0066ff, transparent);
    background-size: 200% 100%; box-shadow: 0 0 25px #0066ff;
    animation: shimmer 3s linear infinite reverse; z-index: 100; }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  .screen { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 18px 16px 90px; }

  .logo-wrap { position: relative; margin: 8px auto 10px; width: fit-content; }

  .logo { width: 100px; height: 100px; object-fit: contain; position: relative; z-index: 2;

  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .title { font-size: 22px; font-weight: 900; letter-spacing: 4px; text-align: center;

  .mining-locked { width: 100%; background: linear-gradient(135deg, rgba(80,80,120,0.25), rgba(50,50,80,0.2));
    border: 1.5px solid rgba(150,150,180,0.3); border-radius: 16px; padding: 14px; text-align: center; margin-bottom: 12px; }
  .lock-icon { font-size: 26px; margin-bottom: 2px; display: block; }

  .fee-box { width: 100%; background: linear-gradient(135deg, rgba(245,184,0,0.2), rgba(255,107,0,0.1));

  .notice { font-size: 10px; color: #a8c5ff; text-align: center; line-height: 1.4;

  .notice strong { color: #f5b800; }

  button { width: 100%; padding: 13px; border: none; border-radius: 12px;
    font-size: 13px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer;
    transition: all 0.2s; font-family: inherit; text-transform: uppercase; }
  button:active { transform: scale(0.97); }
  #connectBtn { background: linear-gradient(135deg, #0066ff, #8b5cf6, #0066ff); background-size: 200% 100%;
    color: #fff; margin-bottom: 8px; box-shadow: 0 4px 25px rgba(0,102,255,0.5); }
  #payBtn { background: linear-gradient(135deg, #f5b800, #ff6b00, #f5b800); background-size: 200% 100%;
    color: #0a1428; box-shadow: 0 4px 25px rgba(245,184,0,0.5); display: none; }
  #payBtn.show { display: block; }
  .demo-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899) !important;
    color: #fff !important; margin-top: 8px; box-shadow: 0 4px 20px rgba(139,92,246,0.4) !important; font-size: 11px !important; }
  .wallet-info { font-size: 10px; color: #6bff8f; margin: 6px 0; padding: 6px;
    background: rgba(50,255,100,0.1); border: 1px solid rgba(50,255,100,0.3);
    border-radius: 8px; word-break: break-all; display: none; text-align: center; font-weight: 600; }
  .wallet-info.show { display: block; }
  .status { font-size: 11px; margin-top: 8px; padding: 8px; border-radius: 8px;
    display: none; text-align: center; width: 100%; font-weight: 600; }
  .status.show { display: block; }
  .status.error { background: rgba(255,50,50,0.15); color: #ff6b6b; border: 1px solid rgba(255,50,50,0.4); }
  .status.success { background: rgba(50,255,100,0.15); color: #6bff8f; border: 1px solid rgba(50,255,100,0.4); }
  .status.loading { background: rgba(107,163,255,0.15); color: #6ba3ff; border: 1px solid rgba(107,163,255,0.4); }

  .home-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
  .home-user { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #f5b800, #ff6b00);
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #0a1428; }
  .home-name { font-size: 13px; font-weight: 700; }
  .home-handle { font-size: 9px; color: #6ba3ff; }
  .coin-hero { text-align: center; padding: 16px 0; background: radial-gradient(circle at center, rgba(245,184,0,0.15), transparent 70%);
    border-radius: 20px; margin-bottom: 12px; }
  .coin-label { font-size: 10px; color: #6ba3ff; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .coin-value { font-size: 44px; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #f5b800, #ff6b00, #ffdd00);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: titleShine 3s linear infinite; margin-bottom: 4px; }
  .coin-sub { font-size: 11px; color: #6ba3ff; font-weight: 700; }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .action-card { background: linear-gradient(135deg, rgba(0,102,255,0.15), rgba(139,92,246,0.1));
    border: 1px solid rgba(107,163,255,0.3); border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .action-card:active { transform: scale(0.97); }
  .action-icon { font-size: 22px; margin-bottom: 4px; display: block; }
  .action-label { font-size: 10px; color: #a8c5ff; font-weight: 700; letter-spacing: 0.5px; }
  .action-value { font-size: 12px; color: #f5b800; font-weight: 800; margin-top: 2px; }

  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(10,20,40,0.95), rgba(5,10,24,0.98));
    border-top: 1px solid rgba(245,184,0,0.3);
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 4px 12px; z-index: 50; backdrop-filter: blur(10px); }
  .nav-item { flex: 1; text-align: center; cursor: pointer; padding: 6px 2px; border-radius: 10px; transition: all 0.2s; }
  .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }
  .nav-label { font-size: 8px; color: #6a7a9a; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .nav-item.active .nav-label { color: #f5b800; }
  .nav-item.active .nav-icon { filter: drop-shadow(0 0 8px rgba(245,184,0,0.8)); transform: scale(1.1); }
  .nav-mine { background: linear-gradient(135deg, #f5b800, #ff6b00);
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-top: -22px; box-shadow: 0 4px 20px rgba(245,184,0,0.6); border: 3px solid #0a1428; }
  .nav-mine .nav-icon { font-size: 24px; margin-bottom: 0; }
  .nav-mine .nav-label { color: #0a1428; font-size: 7px; font-weight: 900; }

  .mine-hero { text-align: center; padding: 20px 0; background: radial-gradient(circle at center, rgba(245,184,0,0.2), transparent 70%);
    border-radius: 20px; margin-bottom: 12px; }
  .pickaxe-spin { font-size: 60px; display: inline-block;
    animation: pickaxeSpin 4s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(245,184,0,0.6)); }
  @keyframes pickaxeSpin { 0%, 100% { transform: rotate(-15deg) translateY(0); } 50% { transform: rotate(15deg) translateY(-10px); } }
  .mine-rate { font-size: 12px; color: #6ba3ff; margin-top: 10px; font-weight: 700; }
  .mine-rate strong { color: #f5b800; font-size: 16px; }
  .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1);
    border-radius: 4px; overflow: hidden; margin: 14px 0 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #f5b800, #ff6b00);
    border-radius: 4px; width: 65%; box-shadow: 0 0 15px rgba(245,184,0,0.6); }
  .collect-btn { background: linear-gradient(135deg, #f5b800, #ff6b00) !important;
    color: #0a1428 !important; margin-top: 8px; box-shadow: 0 4px 25px rgba(245,184,0,0.5) !important; }

  .ads-counter { background: linear-gradient(135deg, rgba(245,184,0,0.15), rgba(255,107,0,0.08));
    border: 1.5px solid rgba(245,184,0,0.5); border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 14px; }
  .ads-count { font-size: 36px; font-weight: 900;
    background: linear-gradient(135deg, #f5b800, #ff6b00);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .ads-label { font-size: 11px; color: #6ba3ff; margin-top: 4px; font-weight: 700; }
  .ad-btn { background: linear-gradient(135deg, #0066ff, #8b5cf6) !important; color: #fff !important;
    box-shadow: 0 4px 25px rgba(0,102,255,0.5) !important; margin-bottom: 10px; }
  .ad-btn:disabled { opacity: 0.4; }

  .wheel-container { text-align: center; padding: 20px 0; }
  .wheel { font-size: 120px; display: inline-block; animation: spinWheel 3s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(245,184,0,0.6)); }
  @keyframes spinWheel { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .wheel.spinning { animation: spinFast 3s linear forwards; }
  @keyframes spinFast { 0% { transform: rotate(0deg); } 100% { transform: rotate(1440deg); } }

  .checkin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-bottom: 14px; }
  .checkin-day { background: linear-gradient(135deg, rgba(0,102,255,0.12), rgba(139,92,246,0.08));
    border: 1px solid rgba(107,163,255,0.25); border-radius: 10px; padding: 10px 4px; text-align: center; }
  .checkin-day.claimed { background: linear-gradient(135deg, rgba(50,255,100,0.15), rgba(50,255,100,0.05));
    border-color: rgba(50,255,100,0.4); }
  .checkin-day.today { background: linear-gradient(135deg, rgba(245,184,0,0.25), rgba(255,107,0,0.15));
    border-color: rgba(245,184,0,0.6); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .checkin-num { font-size: 9px; color: #6ba3ff; font-weight: 700; margin-bottom: 4px; }
  .checkin-reward { font-size: 13px; color: #f5b800; font-weight: 900; }

  .profile-header { text-align: center; padding: 20px 0; margin-bottom: 14px; }

    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 900; color: #0a1428;
    margin: 0 auto 12px; border: 3px solid rgba(245,184,0,0.5); box-shadow: 0 0 30px rgba(245,184,0,0.4); }
  .profile-name { font-size: 18px; font-weight: 900; margin-bottom: 2px; }
  .profile-handle { font-size: 11px; color: #6ba3ff; }
  .profile-item { background: linear-gradient(135deg, rgba(0,102,255,0.12), rgba(139,92,246,0.08));
    border: 1px solid rgba(107,163,255,0.25); border-radius: 12px;
    padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.2s; }
  .profile-item:active { transform: scale(0.98); }
  .profile-item-label { font-size: 12px; color: #a8c5ff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .profile-item-value { font-size: 12px; color: #f5b800; font-weight: 800; }

  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; text-align: center; padding: 40px 20px; }

  .placeholder-title { font-size: 18px; font-weight: 900; color: #f5b800; margin-bottom: 8px; letter-spacing: 1px; }
  .placeholder-text { font-size: 12px; color: #6ba3ff; line-height: 1.5; max-width: 280px; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);

    padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 800; z-index: 1000;
    box-shadow: 0 8px 30px rgba(245,184,0,0.6); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-logo-wrap">
    <img src="file_000000004a1481f4ad0c20442e76e9f7.png" alt="Grover" class="splash-logo">
  </div>
  <div class="splash-title">GROVER</div>
  <div class="splash-subtitle">Mining Bot</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<div class="frame" id="frame">

  <!-- GATE -->
  <div class="screen active" id="gateScreen">
    <div class="logo-wrap">
      <img src="file_000000004a1481f4ad0c20442e76e9f7.png" alt="Grover" class="logo">
    </div>
    <div class="title">GROVER</div>
    <div class="subtitle">Mining Bot</div>
    <div class="mining-locked">
      <span class="lock-icon">🔒</span>
      <div class="mining-label">⛏️ Mining Locked</div>
      <div class="mining-value">0.00<span class="unit">GROVER</span></div>
      <div class="mining-rate">⚡ Level 1 · 1 GROVER/hr</div>
      <div class="mining-lock-text">Unlock by paying 0.05 TON</div>
    </div>
    <div class="stats2">
      <div class="stat"><div class="stat-label">💰 Balance</div><div class="stat-value" id="gateBalance">0</div></div>
      <div class="stat"><div class="stat-label">📈 Profit</div><div class="stat-value" id="gateProfit">0</div></div>
    </div>
    <div class="fee-box">
      <div class="fee-label">⚡ One-Time Entry Fee ⚡</div>
      <div class="fee-value">0.05<span>TON</span></div>
    </div>
    <div class="notice">🔒 Wallet must be <strong>7+ days old</strong> to unlock mining, tasks, ads, referrals and withdrawals.</div>
    <button id="connectBtn">🔗 Connect Wallet</button>
    <button id="payBtn">💎 Pay 0.05 TON</button>
    <button class="demo-btn" id="demoBtn">🎮 Demo Mode (Test Only)</button>
    <div id="walletInfo" class="wallet-info"></div>
    <div id="status" class="status"></div>
  </div>

  <!-- HOME -->
  <div class="screen" id="homeScreen">
    <div class="home-header">
      <div class="home-user">
        <div class="avatar" id="homeAvatar">G</div>
        <div>
          <div class="home-name" id="homeName
