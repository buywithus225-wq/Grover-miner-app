<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grover Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://libtl.com/sdk.js" data-zone="11979593" data-sdk="show_11979593"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;width:100vw;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#030a1a;color:#fff}
.ocean-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wave{position:absolute;width:200%;height:200%;left:-50%;opacity:.15;background:radial-gradient(ellipse at center,#00d4ff 0%,transparent 60%);animation:waveMove 15s ease-in-out infinite}
.wave:nth-child(2){animation-delay:-5s;background:radial-gradient(ellipse at center,#0088ff 0%,transparent 60%)}
.wave:nth-child(3){animation-delay:-10s;background:radial-gradient(ellipse at center,#00ffcc 0%,transparent 60%)}
@keyframes waveMove{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-10%,-5%) scale(1.1)}66%{transform:translate(10%,5%) scale(.95)}}
.splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at center,#0a2a5a 0%,#051428 50%,#030a1a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:220px;height:220px;object-fit:contain;filter:drop-shadow(0 0 50px rgba(0,212,255,.9))}
.splash-title{font-size:40px;font-weight:900;letter-spacing:8px;margin-top:24px;background:linear-gradient(135deg,#f5b800,#ffdd00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.splash-subtitle{font-size:12px;color:#00d4ff;letter-spacing:10px;text-transform:uppercase;font-weight:700;margin-top:6px}
.loading-bar{position:absolute;bottom:80px;width:200px;height:4px;background:rgba(0,212,255,.15);border-radius:2px;overflow:hidden}
.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#00d4ff,#f5b800,#00d4ff);border-radius:2px;animation:loadBar 2s linear forwards}
@keyframes loadBar{0%{width:0}100%{width:100%}}
.frame{width:100vw;height:100vh;background:linear-gradient(160deg,#0a2a5a 0%,#061a3a 50%,#030a1a 100%);position:relative;overflow:hidden;z-index:1;display:flex;flex-direction:column;opacity:0;transition:opacity .8s ease}
.frame.show{opacity:1}
.screen{display:none;flex-direction:column;flex:1;overflow-y:auto;padding:18px 16px 100px;position:relative;z-index:2}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:flex}
.home-top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.live-feed-wrap{width:100%;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:8px;padding:6px 10px;overflow:hidden;white-space:nowrap;margin-bottom:12px}
.live-feed-text{display:inline-block;font-size:10px;color:#00ffcc;font-weight:700;animation:scrollFeed 15s linear infinite}
@keyframes scrollFeed{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.tos-check{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:#a8c5ff;margin-bottom:12px;cursor:pointer;}
.tos-check input{width:16px;height:16px;accent-color:#00d4ff}
.tos-text{color:#00d4ff;text-decoration:underline;cursor:pointer;}
.vip-btn{background:linear-gradient(135deg,#f5b800,#ff6b00);border:1.5px solid rgba(255,255,255,.3);color:#0a1428;font-weight:900;font-size:11px;padding:8px 12px;border-radius:18px;cursor:pointer;font-family:inherit}
.profile-btn{background:linear-gradient(135deg,#00d4ff,#0088ff);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-weight:900;font-size:11px;padding:8px 12px;border-radius:18px;cursor:pointer;font-family:inherit}
.logo-hero{text-align:center;padding:8px 0 6px}
.hero-logo{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 0 40px rgba(0,212,255,.9))}
.earned-counter{text-align:center;margin-bottom:10px}
.earned-value{font-size:34px;font-weight:900;line-height:1;background:linear-gradient(135deg,#00d4ff,#00ffcc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.earned-label{font-size:10px;color:#6ba3ff;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-top:4px}
.balance-box{background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(245,184,0,.08));border:1.5px solid rgba(245,184,0,.4);border-radius:14px;padding:12px;text-align:center;margin-bottom:10px}
.balance-label{font-size:9px;color:#6ba3ff;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.balance-value{font-size:24px;font-weight:900;background:linear-gradient(135deg,#f5b800,#ffdd00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.balance-value span{font-size:12px;color:#f5b800;margin-left:3px;font-weight:700}
.claim-btn{width:100%;padding:18px;background:linear-gradient(135deg,#f5b800,#ffdd00);color:#0a1428;border:none;border-radius:16px;font-size:18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-bottom:8px;position:relative}
.claim-btn:active{transform:scale(.97)}
.mystery-btn{width:100%;padding:13px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border:none;border-radius:14px;font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-bottom:8px}
.checkin-btn{width:100%;padding:12px;background:linear-gradient(135deg,#00d4ff,#0088ff);color:#fff;border:none;border-radius:14px;font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.logo-wrap{position:relative;margin:8px auto 12px;width:fit-content}
.logo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 0 40px rgba(0,212,255,.9))}
.title{font-size:24px;font-weight:900;letter-spacing:4px;text-align:center;background:linear-gradient(135deg,#f5b800,#ffdd00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{font-size:10px;color:#00d4ff;letter-spacing:5px;text-transform:uppercase;font-weight:700;text-align:center;margin-bottom:14px}
.mining-locked{width:100%;background:linear-gradient(135deg,rgba(0,50,100,.4),rgba(0,30,70,.3));border:1.5px solid rgba(0,212,255,.3);border-radius:14px;padding:12px;text-align:center;margin-bottom:10px}
.lock-icon{font-size:24px;margin-bottom:4px;display:block}
.mining-label{font-size:9px;color:#6ba3ff;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.mining-value{font-size:26px;font-weight:900;color:#4a7aaa;letter-spacing:1px}
.mining-value .unit{font-size:11px;margin-left:4px}
.mining-rate{font-size:10px;color:#4a7aaa;margin-top:4px}
.mining-lock-text{font-size:10px;color:#f5b800;font-weight:800;margin-top:6px;text-transform:uppercase}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:10px}
.stat{background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(0,136,255,.08));border:1px solid rgba(0,212,255,.3);border-radius:12px;padding:10px 6px;text-align:center}
.stat-label{font-size:9px;color:#6ba3ff;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.stat-value{font-size:16px;font-weight:900;background:linear-gradient(135deg,#f5b800,#ffdd00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
